<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Funny Story</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Changa+One:ital@0;1&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background: black;
      overflow: hidden;
      font-family: "Changa One", sans-serif;

      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      text-align: center;
      cursor: pointer;
      opacity: 1;
      transition: opacity 1s ease;
    }

    h1 {
      margin: 0;
      font-size: 6rem;
      letter-spacing: 6px;
    }

    .funny {
      color: yellow;
      animation: float 3s ease-in-out infinite;
    }

    .story {
      color: red;
      animation: float 3s ease-in-out infinite reverse;
    }

    .byline {
      margin-top: 18px;
      color: white;
      font-size: 1.3rem;
      letter-spacing: 3px;
      opacity: 0.9;
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
      100% { transform: translateY(0px); }
    }

    .fade-out {
      opacity: 0;
    }

    .hint {
      margin-top: 20px;
      font-size: 1rem;
      color: white;
      opacity: 0.6;
    }
  </style>
</head>

<body>

  <div class="container" id="container">
    <h1 class="funny">FUNNY</h1>
    <h1 class="story">STORY</h1>

    <div class="byline">by Josh Sitch</div>

    <div class="hint">press enter</div>
  </div>

  <audio id="transitionSound" src="audio/rose-anthem-one.mp3"></audio>

  <script>
    const container = document.getElementById("container");
    const sound = document.getElementById("transitionSound");

    let triggered = false;

    function enterSite() {

      if(triggered) return;
      triggered = true;

      sessionStorage.clear();

      container.classList.add("fade-out");

      sound.currentTime = 0;
      sound.play();

      setTimeout(() => {
        window.location.href = "intro2.html";
      }, 1000);
    }

    container.addEventListener("click", enterSite);

    document.addEventListener("keydown", function(e) {
      if (e.key === "Enter") {
        enterSite();
      }
    });
  </script>

</body>
</html>
