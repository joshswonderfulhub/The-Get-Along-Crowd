<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>DA MAYORS LETTER</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Changa+One:ital@0;1&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
background:white;
color:black;
font-family:'Changa One', sans-serif;
height:100vh;
overflow:hidden;
}

/* TITLE SCREEN */
#titleScreen{
position:absolute;
width:100%;
height:100%;
display:flex;
justify-content:center;
align-items:center;
font-size:5rem;
cursor:pointer;
opacity:1;
transition:opacity 1.5s ease;
background:white;
color:black;
}

/* MAIN LETTER */
#main{
display:none;
height:100vh;
justify-content:center;
align-items:center;
opacity:0;
transition:opacity 1.5s ease;
}

.message-box{
width:75vw;
max-width:950px;
height:72vh;
border:1px solid black;
padding:55px;
background:white;
}

#text{
font-size:28px;
line-height:1.8;
white-space:pre-wrap;
height:100%;
overflow-y:auto;
scrollbar-width:none;
}

#text::-webkit-scrollbar{
display:none;
}

.cursor{
animation:blink 1s step-end infinite;
}

@keyframes blink{
50%{opacity:0;}
}

.trigger{
color:red;
cursor:pointer;
}

.trigger:hover{
opacity:.7;
}

.fade-out{
opacity:0 !important;
transition:opacity 1.5s ease;
}
</style>
</head>

<body>

<div id="titleScreen">
DA MAYORS LETTER
</div>

<div id="main">
  <div class="message-box">
    <div id="text"></div>
  </div>
</div>

<audio id="music" src="audio/mayor-theme-one.mp3" loop></audio>

<audio id="typing1" src="audio/mayor-text-sound-one.mp3"></audio>
<audio id="typing2" src="audio/mayor-text-sound-one.mp3"></audio>
<audio id="typing3" src="audio/mayor-text-sound-one.mp3"></audio>

<script>

const titleScreen = document.getElementById("titleScreen");
const main = document.getElementById("main");
const box = document.getElementById("text");
const music = document.getElementById("music");

const voices = [
document.getElementById("typing1"),
document.getElementById("typing2"),
document.getElementById("typing3")
];

let voiceIndex = 0;
let started = false;

titleScreen.onclick = function(){

if(started) return;
started = true;

music.volume = 0.6;
music.play();

titleScreen.classList.add("fade-out");

setTimeout(function(){

titleScreen.style.display = "none";
main.style.display = "flex";

setTimeout(function(){
main.style.opacity = "1";
startTyping();
},100);

},1500);

};

function playTypeSound(){

if(Math.random() < 0.65){

let v = voices[voiceIndex];

v.currentTime = 0;
v.playbackRate = 0.85 + Math.random()*0.45;
v.volume = 0.22;
v.play();

voiceIndex++;

if(voiceIndex >= voices.length){
voiceIndex = 0;
}

}

}

const segments = [

`Dear owner of `,

`[Super Noodle,]`,

`\n\n\tThis is a courtesy letter letting you know your lease is coming to an end on the 30th of `,

`[June,]`,

` i.e. in SEVEN `,

`[DAYS,]`,

` and you will have a tonnnnnnnnnn of trouble if all your shit is still here by `,

`[then.]`,

` Okay thanks bye `,

`[toodles!!!!]`,

`\n\nSigned,\n\n`,

`[Garret Hospitality]`,

`\n\n`,

`[Mayor of Randwood]`

];

let segment = 0;
let i = 0;

function startTyping(){
typeSegment();
}

function typeSegment(){

if(segment >= segments.length){

main.classList.add("fade-out");

setTimeout(function(){
window.location.href = "super-noodle-2.html";
},1500);

return;
}

let current = segments[segment];

if(current.startsWith("[") && current.endsWith("]")){

let word = current.slice(1,-1);

box.innerHTML +=
'<span class="trigger">' +
word +
'</span>&nbsp;';

box.scrollTop = box.scrollHeight;

document
.querySelectorAll(".trigger")
.forEach(t=>{
t.onclick = continueTyping;
});

return;
}

function typeLetter(){

if(i >= current.length){

i = 0;
segment++;

typeSegment();
return;
}

playTypeSound();

box.innerHTML +=
current.charAt(i) +
'<span class="cursor">|</span>';

box.innerHTML =
box.innerHTML.replace(
/<span class="cursor">\|<\/span>(?!.*cursor)/g,
''
);

box.scrollTop = box.scrollHeight;

let speed = 22 + Math.random()*14;

if(current[i] === "."){
speed = 140;
}

if(current[i] === ","){
speed = 80;
}

if(current[i] === "—"){
speed = 110;
}

if(current[i] === "\n"){
speed = 180;
}

i++;

setTimeout(typeLetter,speed);

}

typeLetter();

}

function continueTyping(event){

event.target.onclick = null;

segment++;

typeSegment();

}

</script>

</body>
</html>
