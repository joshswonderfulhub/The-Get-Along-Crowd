<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>DA MAYOR</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Changa+One:ital@0;1&display=swap" rel="stylesheet">

<style>

*{margin:0;padding:0;box-sizing:border-box;}

body{
background:black;
color:white;
font-family:'Changa One', sans-serif;
height:100vh;
overflow:hidden;
}

/* TITLE */
#titleScreen{
position:absolute;
width:100%;
height:100%;
display:flex;
justify-content:center;
align-items:center;
font-size:5rem;
cursor:pointer;
transition:opacity 1.5s ease;
}

#main{
display:none;
height:100%;
justify-content:center;
align-items:center;
}

.message-box{
width:75vw;
max-width:950px;
height:72vh;
border:1px solid white;
padding:55px;
}

#text{
font-size:28px;
line-height:1.8;
white-space:pre-wrap;
height:100%;
overflow-y:auto;
scrollbar-width:none;
}
#text::-webkit-scrollbar{display:none;}

.cursor{
animation:blink 1s step-end infinite;
}
@keyframes blink{50%{opacity:0;}}

.trigger{
color:red;
cursor:pointer;
}
.trigger:hover{opacity:.7;}

.fade-out{
opacity:0;
transition:opacity 1.5s ease;
}

</style>
</head>
<body>

<div id="titleScreen">DA MAYOR</div>

<div id="main">
  <div class="message-box">
    <div id="text"></div>
  </div>
</div>

<!-- AUDIO -->
<audio id="music" src="audio/mayor-theme-one.mp3" loop></audio>
<audio id="typingSound" src="audio/mayor-text-sound-one.mp3"></audio>

<script>

/* ---------- ELEMENTS ---------- */
const title = document.getElementById("titleScreen");
const main = document.getElementById("main");
const music = document.getElementById("music");
const typingSound = document.getElementById("typingSound");
const box = document.getElementById("text");

/* ---------- TITLE CLICK ---------- */
title.onclick = () => {

  music.volume = 0.6;
  music.play();

  title.classList.add("fade-out");

  setTimeout(()=>{
    title.style.display="none";
    main.style.display="flex";
    startTyping();
  },1500);
};

/* ---------- SCRIPT ---------- */

const segments = [

`Eugh. `,

`[The mayor looked down today.]`,

` He has these giant picture windows at the top floor of his skyscraper, a beautiful penthouse view of Melbourne in all its glory, that he gazes upon `,

`[regularly,]`,

` but he never looks `,

`[down.]`,

` Today he looked `,

`[down.]`,

` The one sore spot of this city, his kingdom, his ugly little kingdom—`,

`[Randwood.]`,

` And the hub of it, Randwood Central, with the useless little fountain, and the rubbish, and the bums, and the disgusting little drones that all inhabit the `,

`[place.]`,

` He wanted to `,

`[vomit.]`,

` It astounds him, really. That they persist in this `,

`[place.]`,

` It’s laughable, `,

`[haha.]`,

` Makes him `,

`[laugh.]`,

` He shook his head. He was thankful that they `,

`[do.]`,

` He was truly `,

`[thankful.]`,

` He disrobed and hopped into his gold-plated hot tub—it keeps him very warm in a harsh, unforgiving Melbourne Winter—and poured a glass of 2008 Krug, sipping it, `,

`[slowly.]`

];

let segment = 0;
let i = 0;

/* ---------- TYPE SYSTEM ---------- */

function playTypeSound(){

  // only trigger occasionally
  if(Math.random() < 0.55){

    typingSound.currentTime = 0;

    typingSound.playbackRate =
      0.8 + Math.random() * 0.5;

    typingSound.volume = 0.20;

    typingSound.play();
  }

}

function startTyping(){
  typeSegment();
}

function typeSegment(){

if(segment >= segments.length){
  return;
}

let current = segments[segment];

/* CLICKABLE */
if(current.startsWith("[") && current.endsWith("]")){

let word = current.slice(1,-1);

box.innerHTML += `<span class="trigger">${word}</span>`;
box.scrollTop = box.scrollHeight;

document.querySelectorAll(".trigger").forEach(t=>{
  t.onclick = continueTyping;
});

return;
}

/* NORMAL TEXT */
function typeLetter(){

if(i >= current.length){
  i = 0;
  segment++;
  typeSegment();
  return;
}

playTypeSound();

box.innerHTML += current.charAt(i) + '<span class="cursor">|</span>';

box.innerHTML = box.innerHTML.replace(
/<span class="cursor">\|<\/span>(?!.*cursor)/g,''
);

box.scrollTop = box.scrollHeight;

let char = current[i];
let speed = 22 + Math.random()*14; // faster + more human

if(char === ".") speed = 140;
if(char === ",") speed = 80;
if(char === "—") speed = 110;

i++;

setTimeout(typeLetter, speed);
}

typeLetter();

}

/* ---------- CONTINUE ---------- */

function continueTyping(){

segment++;

if(segment >= segments.length){

document.body.classList.add("fade-out");

setTimeout(()=>{
  window.location.href = "intro-mayor-choice-one.html";
},1500);

return;
}

typeSegment();

}

</script>

</body>
</html>
