<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WATCH TV</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Changa+One:ital@0;1&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:black;
color:white;
font-family:'Changa One', sans-serif;
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
opacity:0;
transition:opacity 1.5s ease;
}

.message-box{
width:75vw;
max-width:950px;
height:72vh;
border:1px solid white;
padding:55px;
}

#text{
font-size:28px;
line-height:1.8;
white-space:pre-wrap;
height:100%;
overflow-y:auto;
scrollbar-width:none;
}

#text::-webkit-scrollbar{
display:none;
}

.cursor{
animation:blink 1s step-end infinite;
}

@keyframes blink{
50%{
opacity:0;
}
}

.trigger{
color:red;
cursor:pointer;
}

.trigger:hover{
opacity:.7;
}

.fade-out{
opacity:0;
transition:opacity 1.5s ease;
}

</style>
</head>
<body>

<div class="message-box">
<div id="text"></div>
</div>

<audio id="music" src="audio/mayor-theme-one.mp3" loop></audio>

<audio id="typing1" src="audio/mayor-text-sound-one.mp3"></audio>
<audio id="typing2" src="audio/mayor-text-sound-one.mp3"></audio>
<audio id="typing3" src="audio/mayor-text-sound-one.mp3"></audio>

<audio id="ding" src="audio/ding.mp3"></audio>

<script>

const box = document.getElementById("text");
const music = document.getElementById("music");
const ding = document.getElementById("ding");

const voices = [
document.getElementById("typing1"),
document.getElementById("typing2"),
document.getElementById("typing3")
];

let voiceIndex = 0;

window.onload = function(){

document.body.style.opacity = "1";

music.volume = 0.6;

music.play().catch(()=>{
document.addEventListener("click",()=>{
music.play();
},{once:true});
});

setTimeout(startTyping,500);

};

function playTypeSound(){

if(Math.random() < 0.65){

let v = voices[voiceIndex];

v.currentTime = 0;
v.playbackRate = 0.85 + Math.random()*0.45;
v.volume = 0.10;
v.play();

voiceIndex++;

if(voiceIndex >= voices.length){
voiceIndex = 0;
}

}

}

function playDing(){
ding.currentTime = 0;
ding.volume = 0.6;
ding.play();
}

const segments = [

`He clapped definitively twice and the flat screen slowly lowered itself down through the hole in the `,

`[roof.]`,

` His favourite thing to watch is `,

`[Mastermind]`,

`—actually only one episode of Mastermind where he’s memorised every `,

`[answer.]`,

` `,

`[‘1991!’|ding]`,

` `,

`[‘Chilly Bin!’|ding]`,

` `,

`[‘The Chinese!’|ding]`,

` And near the end of the episode it cuts to a spliced-in video featuring a shabby-looking recreation of the Mastermind set and a bunch of people in Randwood Police uniforms behind cardboard `,

`[podiums.]`,

` ‘Um, so uh,’ the host started to `,

`[say,]`,

` draped in a Randwood Police uniform but with a red tie around his neck, ‘what is the name of the Mayor’s first `,

`[dog?’]`,

` All the guards looked at each other `,

`[clueless.]`,

` ‘Basher! Basher! Basher!’ the Mayor said, with a mouthful of wagyu. He was very good at this `,

`[one.]`

];

let segment = 0;
let i = 0;

function startTyping(){
typeSegment();
}

function typeSegment(){

if(segment >= segments.length){

document.body.classList.add("fade-out");

setTimeout(function(){
window.location.href = "call-boys.html";
},1500);

return;
}

let current = segments[segment];

if(current.startsWith("[") && current.endsWith("]")){

let raw = current.slice(1,-1);
let parts = raw.split("|");

let word = parts[0];
let hasDing = parts[1] === "ding";

box.innerHTML +=
'<span class="trigger" data-ding="' +
hasDing +
'">' +
word +
'</span>';

box.scrollTop = box.scrollHeight;

document
.querySelectorAll(".trigger")
.forEach(t=>{
t.onclick = continueTyping;
});

return;
}

function typeLetter(){

if(i >= current.length){

i = 0;
segment++;

typeSegment();
return;
}

playTypeSound();

box.innerHTML +=
current.charAt(i) +
'<span class="cursor">|</span>';

box.innerHTML =
box.innerHTML.replace(
/<span class="cursor">\|<\/span>(?!.*cursor)/g,
''
);

box.scrollTop = box.scrollHeight;

let speed = 22 + Math.random()*14;

if(current[i] === "."){
speed = 140;
}

if(current[i] === ","){
speed = 80;
}

if(current[i] === "—"){
speed = 110;
}

i++;

setTimeout(typeLetter,speed);

}

typeLetter();

}

function continueTyping(event){

let clicked = event.target;

if(clicked.dataset.ding === "true"){
playDing();
}

clicked.onclick = null;

segment++;

typeSegment();

}

</script>

</body>
</html>
