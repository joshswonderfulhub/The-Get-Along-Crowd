<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PIGEON</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Changa+One:ital@0;1&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
background:black;
color:white;
font-family:'Changa One', sans-serif;
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
opacity:0;
transition:opacity 1.5s ease;
}

.message-box{
width:75vw;
max-width:950px;
height:72vh;
border:1px solid white;
padding:55px;
}

#text{
font-size:28px;
line-height:1.8;
white-space:pre-wrap;
height:100%;
overflow-y:auto;
scrollbar-width:none;
}

#text::-webkit-scrollbar{
display:none;
}

.cursor{
animation:blink 1s step-end infinite;
}

@keyframes blink{
50%{opacity:0;}
}

.trigger{
color:deepskyblue;
cursor:pointer;
}

.trigger:hover{
opacity:.7;
}

.fade-out{
opacity:0;
transition:opacity 1.5s ease;
}
</style>
</head>

<body>

<div class="message-box">
<div id="text"></div>
</div>

<audio id="music" src="audio/tom-and-jack-theme.mp3" loop></audio>

<audio id="typing1" src="audio/tom-and-jack-sound.mp3"></audio>
<audio id="typing2" src="audio/tom-and-jack-sound.mp3"></audio>
<audio id="typing3" src="audio/tom-and-jack-sound.mp3"></audio>

<audio id="magpie" src="audio/magpie.mp3"></audio>
<audio id="pigeon" src="audio/pigeon.mp3"></audio>

<script>

const box = document.getElementById("text");
const music = document.getElementById("music");
const magpie = document.getElementById("magpie");
const pigeon = document.getElementById("pigeon");

const voices = [
document.getElementById("typing1"),
document.getElementById("typing2"),
document.getElementById("typing3")
];

let voiceIndex = 0;

window.onload = function(){

document.body.style.opacity = "1";

music.volume = 0.6;

music.play().catch(()=>{
document.addEventListener("click",()=>{
music.play();
},{once:true});
});

setTimeout(startTyping,500);

};

function playTypeSound(){

if(Math.random() < 0.65){

let v = voices[voiceIndex];

v.currentTime = 0;
v.playbackRate = 0.85 + Math.random()*0.45;
v.volume = 0.22;
v.play();

voiceIndex++;

if(voiceIndex >= voices.length){
voiceIndex = 0;
}

}

}

function playSpecialSound(soundName){

let s = null;

if(soundName === "magpie"){
s = magpie;
}

if(soundName === "pigeon"){
s = pigeon;
}

if(s){
s.currentTime = 0;
s.volume = 0.5;
s.play();
}

}

const segments = [

`\tSometimes, Tom runs out of surface so he just starts painting the `,

`[birds.]`,

` Not with spray paint, of course, just with this red food dye he got, he’s not a `,

`[monster.]`,

` And it’s actually not even him who tags `,

`[them.]`,

`\n\tWe walked over to where the birds mostly congregate, around `,

`[Jimmy.|magpie]`,

` Jimmy is a bum we’re friends with who has the trust of all the birds around `,

`[Randwood Central.]`,

` We caught him then dancing elegantly—in his crusty green jacket and brown pants—amidst the pigeons and the noisy miners, and the magpies, gingerly leaping and landing in every space between them while they waddled `,

`[around]`,

` `,

`[unphased.]`,

` All the birds are extremely skittish but not around `,

`[Jimmy.]`,

`\n\t‘Oi, Jim.’\n\tJim looked up and `,

`[smiled.]`,

`\n\t‘Hey boys.’\n\t‘We need you to paint a couple `,

`[birds.’]`,

`\n\tTom chucked over his food dye and Jimmy caught it deftly, still dancing. He grabbed one of the pigeons waddling around and started to neatly carve in the letters, `,

`[‘SPG’.|pigeon]`,

`\n\t‘Thanks, Jim, you’re a real `,

`[one.’]`,

`\n\t‘Heh, a real one. I guess I am. Aren’t we `,

`[all?’]`,

`\n\t‘Hell yeah, Jim, hell `,

`[yeah.’]`,

`\n\t‘A real rat.’\n\t`,

`[‘Sorry?’]`,

`\n\t‘They’ve got a real rat, over there’—Jim pointed to the Mayor’s skyscraper—’a real rat they say, said they’re gonna squash `,

`[it.’]`,

`\n\t‘What are you on about?’ I `,

`[asked.]`,

`\n\t‘The `,

`[rat.’]`,

`\n\t‘Whatever, Jim, just finish the `,

`[art.’]`

];

let segment = 0;
let i = 0;

function startTyping(){
typeSegment();
}

function typeSegment(){

if(segment >= segments.length){

document.body.classList.add("fade-out");

setTimeout(function(){
window.location.href = "tag-menu-after-pigeon.html";
},1500);

return;
}

let current = segments[segment];

if(current.startsWith("[") && current.endsWith("]")){

let raw = current.slice(1,-1);
let parts = raw.split("|");

let word = parts[0];
let sound = parts[1];

box.innerHTML +=
'<span class="trigger" data-sound="' +
(sound || "") +
'">' +
word +
'</span>&nbsp;';

box.scrollTop = box.scrollHeight;

document
.querySelectorAll(".trigger")
.forEach(t=>{
t.onclick = continueTyping;
});

return;
}

function typeLetter(){

if(i >= current.length){

i = 0;
segment++;

typeSegment();
return;
}

playTypeSound();

box.innerHTML +=
current.charAt(i) +
'<span class="cursor">|</span>';

box.innerHTML =
box.innerHTML.replace(
/<span class="cursor">\|<\/span>(?!.*cursor)/g,
''
);

box.scrollTop = box.scrollHeight;

let speed = 22 + Math.random()*14;

if(current[i] === "."){
speed = 140;
}

if(current[i] === ","){
speed = 80;
}

if(current[i] === "—"){
speed = 110;
}

if(current[i] === "\n"){
speed = 180;
}

i++;

setTimeout(typeLetter,speed);

}

typeLetter();

}

function continueTyping(event){

let clicked = event.target;

if(clicked.dataset.sound){
playSpecialSound(clicked.dataset.sound);
}

clicked.onclick = null;

segment++;

typeSegment();

}

</script>

</body>
</html>
