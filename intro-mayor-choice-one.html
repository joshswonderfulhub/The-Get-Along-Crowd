<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Choose</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Changa+One:ital@0;1&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:black;
color:white;
font-family:'Changa One', sans-serif;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

.message-box{
width:75vw;
max-width:950px;
height:72vh;
border:1px solid white;
padding:55px;

display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

.choice-title{
font-size:3rem;
margin-bottom:80px;
}

.choices{
display:flex;
justify-content:center;
align-items:center;
gap:140px;
}

.choice{
font-size:2.5rem;
cursor:pointer;
transition:all .2s ease;
user-select:none;
}

.choice:hover{
transform:scale(1.08);
}

.yellow{
color:yellow;
}

.red{
color:red;
}

.fade-out{
opacity:0;
transition:opacity 1.5s ease;
}

</style>
</head>

<body>

<div class="message-box">

  <div class="choice-title">
    Choose:
  </div>

  <div class="choices">

    <div class="choice yellow" onclick="watchTV()">
      WATCH TV
    </div>

    <div class="choice red" onclick="requestFood()">
      REQUEST MORE FOOD
    </div>

  </div>

</div>

<script>

function watchTV(){

  document.body.classList.add("fade-out");

  setTimeout(function(){
    window.location.href = "watch-tv.html";
  },1500);

}

function requestFood(){

  document.body.classList.add("fade-out");

  setTimeout(function(){
    window.location.href = "request-food-mayor.html";
  },1500);

}

</script>

</body>
</html>
