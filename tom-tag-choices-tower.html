<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TOWER</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Changa+One:ital@0;1&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
background:black;
color:white;
font-family:'Changa One', sans-serif;
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
opacity:0;
transition:opacity 1.5s ease;
}

.message-box{
width:75vw;
max-width:950px;
height:72vh;
border:1px solid white;
padding:55px;
}

#text{
font-size:28px;
line-height:1.8;
white-space:pre-wrap;
height:100%;
overflow-y:auto;
scrollbar-width:none;
}

#text::-webkit-scrollbar{
display:none;
}

.cursor{
animation:blink 1s step-end infinite;
}

@keyframes blink{
50%{opacity:0;}
}

.trigger{
color:deepskyblue;
cursor:pointer;
}

.trigger.gold-text{
color:gold;
}

.trigger:hover{
opacity:.7;
}

.fade-out{
opacity:0;
transition:opacity 1.5s ease;
}
</style>
</head>

<body>

<div class="message-box">
<div id="text"></div>
</div>

<audio id="mayorTheme" src="audio/mayor-theme-two.mp3" loop></audio>

<audio id="typing1" src="audio/tom-and-jack-sound.mp3"></audio>
<audio id="typing2" src="audio/tom-and-jack-sound.mp3"></audio>
<audio id="typing3" src="audio/tom-and-jack-sound.mp3"></audio>

<audio id="doorBash" src="audio/door-bash.mp3"></audio>
<audio id="bongo" src="audio/bongo.mp3"></audio>
<audio id="spray" src="audio/spray-paint.mp3"></audio>
<audio id="alarm" src="audio/alarmbell.mp3"></audio>

<script>

const box = document.getElementById("text");

const mayorTheme = document.getElementById("mayorTheme");

const doorBash = document.getElementById("doorBash");
const bongo = document.getElementById("bongo");
const spray = document.getElementById("spray");
const alarm = document.getElementById("alarm");

const voices = [
document.getElementById("typing1"),
document.getElementById("typing2"),
document.getElementById("typing3")
];

let voiceIndex = 0;

window.onload = function(){

document.body.style.opacity = "1";

mayorTheme.volume = 0.6;

setTimeout(startTyping,500);

};

function playTypeSound(){

if(Math.random() < 0.65){

let v = voices[voiceIndex];

v.currentTime = 0;
v.playbackRate = 0.85 + Math.random()*0.45;
v.volume = 0.22;
v.play();

voiceIndex++;

if(voiceIndex >= voices.length){
voiceIndex = 0;
}

}

}

function playSpecialSound(soundName){

if(soundName === "door"){
doorBash.currentTime = 0;
doorBash.volume = 0.75;
doorBash.play();
}

if(soundName === "door2"){
doorBash.currentTime = 0;
doorBash.volume = 0.75;
doorBash.play();

setTimeout(function(){
doorBash.currentTime = 0;
doorBash.play();
},260);
}

if(soundName === "bongo"){
bongo.currentTime = 0;
bongo.volume = 0.75;
bongo.play();
}

if(soundName === "spray"){
spray.currentTime = 0;
spray.volume = 0.75;
spray.play();
}

if(soundName === "alarm"){
mayorTheme.currentTime = 0;
mayorTheme.play();

alarm.currentTime = 0;
alarm.volume = 0.8;
alarm.play();
}

}

const segments = [

`Tom walked up to the big stainless-steel entrance door, with `,

`[‘DA MAYOR’S HOUSE’|gold]`,

` embossed on the top of the door in gold lettering. Tom bashed on the `,

`[door.|door]`,

` `,

`[No response.]`,

` He slapped on it `,

`[incessantly.|door2]`,

` `,

`[No response.]`,

` He played it like a `,

`[bongo drum.|bongo]`,

` `,

`[No response.]`,

` A big security camera the size of a Marvel Red was pointed right where Tom was `,

`[standing.]`,

` Tom reached into his `,

`[pocket.]`,

`\n‘Don’t `,

`[Tom.’]`,

`\n‘Don’t `,

`[what.’]`,

`\n‘Do `,

`[it.’]`,

`\n`,

`[‘Why?’]`,

`\n‘You’ll get in `,

`[trouble.’]`,

`\n`,

`[‘Nah.’]`,

`\nTom grabbed his red spray-paint can and held it up to the `,

`[lens.]`,

`\n`,

`[‘DON’T’]`,

`\n\nTom pulled the `,

`[trigger.|spray]`,

` `,

`[All|alarm]`,

` of a sudden a massive alarm bell set off and the big steel door `,

`[opened.]`,

` Red light flashed across our faces as a squadron rolled out from the massive hall of floor `,

`[one.]`,

` They charged at Tom and snatched him `,

`[up.]`,

`\n`,

`[‘NO!’]`,

`\nI tried to stop them but there were too many.\n‘You don’t wanna end up like him you little stupid FUCK!’ `,

`[one officer said.]`,

`\nThe door shut right in my face. And I was `,

`[alone.]`,

`\n\n`,

`[Shit.]`

];

let segment = 0;
let i = 0;

function startTyping(){
typeSegment();
}

function typeSegment(){

if(segment >= segments.length){

document.body.classList.add("fade-out");

setTimeout(function(){

window.location.href =
"roonie-text.html";

},1500);

return;
}

let current = segments[segment];

if(current.startsWith("[") && current.endsWith("]")){

let raw = current.slice(1,-1);
let parts = raw.split("|");

let word = parts[0];
let tag = parts[1];

let colourClass = "";

if(tag === "gold"){
colourClass = " gold-text";
}

box.innerHTML +=
'<span class="trigger' +
colourClass +
'" data-special="' +
(tag || "") +
'">' +
word +
'</span>&nbsp;';

box.scrollTop = box.scrollHeight;

document
.querySelectorAll(".trigger")
.forEach(t=>{
t.onclick = continueTyping;
});

return;
}

function typeLetter(){

if(i >= current.length){

i = 0;
segment++;

typeSegment();
return;
}

playTypeSound();

box.innerHTML +=
current.charAt(i) +
'<span class="cursor">|</span>';

box.innerHTML =
box.innerHTML.replace(
/<span class="cursor">\|<\/span>(?!.*cursor)/g,
''
);

box.scrollTop = box.scrollHeight;

let speed = 22 + Math.random()*14;

if(current[i] === "."){
speed = 140;
}

if(current[i] === ","){
speed = 80;
}

if(current[i] === "—"){
speed = 110;
}

if(current[i] === "\n"){
speed = 180;
}

i++;

setTimeout(typeLetter,speed);

}

typeLetter();

}

function continueTyping(event){

let clicked = event.target;

if(clicked.dataset.special){
playSpecialSound(clicked.dataset.special);
}

clicked.onclick = null;

segment++;

typeSegment();

}

</script>

</body>
</html>
